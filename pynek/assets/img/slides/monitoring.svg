<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A radar sweep detecting leaked credentials and lookalike domains">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d04"/><stop offset="54%" stop-color="#3d1f0a"/><stop offset="100%" stop-color="#140a03"/>
    </linearGradient>
    <radialGradient id="mglow" cx="70%" cy="26%" r="58%">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".4"/><stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mscope" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3d0f" stop-opacity=".6"/><stop offset="100%" stop-color="#2a1405" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="msweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74" stop-opacity=".55"/><stop offset="100%" stop-color="#fdba74" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mscrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0d04" stop-opacity=".93"/><stop offset="42%" stop-color="#1a0d04" stop-opacity=".55"/><stop offset="100%" stop-color="#1a0d04" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mgrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#ffffff" stroke-opacity=".27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#mbg)"/>
  <rect width="1600" height="900" fill="url(#mgrid)"/>
  <rect width="1600" height="900" fill="url(#mglow)"/>

  <!-- radar scope -->
  <g transform="translate(1110 450)">
    <circle r="310" fill="url(#mscope)" stroke="#fb923c" stroke-opacity=".54" stroke-width="2"/>
    <g fill="none" stroke="#fb923c" stroke-opacity=".42">
      <circle r="240"/><circle r="170"/><circle r="100"/><circle r="40"/>
    </g>
    <path d="M-310 0h620M0 -310v620" stroke="#fb923c" stroke-opacity=".44" stroke-width="1.5"/>
    <path d="M-219 -219L219 219M219 -219L-219 219" stroke="#fb923c" stroke-opacity=".34" stroke-width="1.5"/>
    <path d="M0 0 L0 -310 A310 310 0 0 1 268 -155 Z" fill="url(#msweep)"/>
    <path d="M0 0 L268 -155" stroke="#fdba74" stroke-opacity=".92" stroke-width="2.5"/>
    <!-- contacts -->
    <g>
      <circle cx="148" cy="-96" r="9" fill="#ff5b6e"/>
      <circle cx="148" cy="-96" r="21" fill="none" stroke="#ff5b6e" stroke-opacity=".72" stroke-width="2"/>
      <circle cx="-118" cy="62" r="7" fill="#fdba74"/>
      <circle cx="62" cy="182" r="7" fill="#fdba74" opacity=".7"/>
      <circle cx="-186" cy="-128" r="6" fill="#fdba74" opacity=".5"/>
      <circle cx="226" cy="96" r="6" fill="#fdba74" opacity=".55"/>
    </g>
  </g>

</svg>
