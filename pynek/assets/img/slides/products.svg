<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Layered security platforms stacked into a defended estate">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0720"/><stop offset="54%" stop-color="#1e1350"/><stop offset="100%" stop-color="#090619"/>
    </linearGradient>
    <radialGradient id="qglow" cx="70%" cy="24%" r="58%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".42"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qlayer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/><stop offset="100%" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="qshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="qscrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0720" stop-opacity=".93"/><stop offset="42%" stop-color="#0c0720" stop-opacity=".55"/><stop offset="100%" stop-color="#0c0720" stop-opacity="0"/>
    </linearGradient>
    <pattern id="qgrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#ffffff" stroke-opacity=".27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#qbg)"/>
  <rect width="1600" height="900" fill="url(#qgrid)"/>
  <rect width="1600" height="900" fill="url(#qglow)"/>

  <!-- stacked isometric platform layers -->
  <g transform="translate(1080 470)">
    <g opacity=".95">
      <path d="M0 220 L300 100 L0 -20 L-300 100 Z" fill="url(#qlayer)" stroke="#a78bfa" stroke-opacity=".67" stroke-width="2"/>
      <path d="M0 110 L300 -10 L0 -130 L-300 -10 Z" fill="url(#qlayer)" stroke="#a78bfa" stroke-opacity=".72" stroke-width="2"/>
      <path d="M0 0 L300 -120 L0 -240 L-300 -120 Z" fill="url(#qlayer)" stroke="#c4b5fd" stroke-opacity=".82" stroke-width="2"/>
    </g>
    <g fill="#c4b5fd" opacity=".85">
      <circle cx="-150" cy="115" r="7"/><circle cx="0" cy="190" r="7"/><circle cx="150" cy="115" r="7"/>
      <circle cx="-150" cy="5" r="7"/><circle cx="0" cy="80" r="7"/><circle cx="150" cy="5" r="7"/>
      <circle cx="-150" cy="-105" r="7"/><circle cx="0" cy="-30" r="7"/><circle cx="150" cy="-105" r="7"/>
    </g>
    <!-- shield crowning the stack -->
    <g transform="translate(0 -330)">
      <path d="M0 -84 L74 -56 v66 c0 50 -34 78 -74 94 -40 -16 -74 -44 -74 -94 v-66 Z" fill="url(#qshield)" opacity=".92"/>
      <path d="M-30 4 l20 21 l44 -47" fill="none" stroke="#1b1147" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#c4b5fd" stroke-opacity=".62" stroke-width="2" stroke-dasharray="7 9" fill="none">
      <path d="M0 -240 L0 -330"/>
    </g>
  </g>

</svg>
